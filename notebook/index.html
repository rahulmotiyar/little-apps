<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-lang-text="notebook">Notebook</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../productivity.css">
  <link rel="stylesheet" href="styles.css?v=notebook-tools-1">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../still-apps.css?v=viewport-fit-3">
  <link rel="stylesheet" href="../drawing/toolbar.css?v=20261121-notebook-rail">
  <link rel="stylesheet" href="workspace.css?v=notebook-tools-1">
  <link rel="stylesheet" href="../fullscreen.css?v=viewport-fit-3">
</head>
<body>
  <div class="tool-page notebook-page is-empty" id="notebook-page">
    <header class="tool-header notebook-header">
      <div class="notebook-heading">
        <h1 class="tool-title" data-lang-text="notebook">Notebook</h1>
        <button class="index-action" id="toggle-index" type="button" aria-label="Collapse sidebar" aria-controls="notebook-index" aria-expanded="true" title="Collapse sidebar"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></svg></button>
      </div>
      <div class="tool-controls">
        <div class="tool-actions">
          <button class="tool-button icon-undo" id="undo-remove" type="button" aria-label="Undo remove" title="Undo remove" style="display:none">Undo remove</button>
        </div>
        <span class="notebook-exit app-exit-group"><a class="close-app app-close" id="exit" href="../" aria-label="Exit Notebook" data-lang-label="exit"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a></span>
      </div>
<button type="button" id="web-fullscreen" class="web-fullscreen-button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
  <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
  <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
</button>
<div id="web-fullscreen-message" class="web-fullscreen-message" role="status"></div>
    </header>
    <p class="tool-status storage-status" id="storage-status" role="status" aria-live="polite" style="display:none"></p>
    <main class="notebook-layout">
      <aside class="notes-list-panel" id="notebook-index" aria-label="Notebook index">
        <div class="index-heading">
          <div class="index-actions">
            <button class="index-action" id="new-note" type="button" aria-label="New note" title="New note"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13 21H5V3h9l5 5v5M14 3v5h5m-1 7v6m-3-3h6"/></svg></button>
            <button class="index-action" id="new-section" type="button" aria-label="New section" title="New section"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h7l2 2h9v12H3zm9 5v6m-3-3h6"/></svg></button>
          </div>
        </div>
        <form class="section-form" id="section-form" hidden>
          <label for="section-name">Section name</label>
          <input id="section-name" type="text" maxlength="60" autocomplete="off" required>
          <div class="section-form-actions">
            <button class="tool-button" id="add-section" type="submit">Add</button>
            <button class="tool-button" id="cancel-section" type="button">Cancel</button>
          </div>
          <p id="section-error" role="status" aria-live="polite"></p>
        </form>
        <div id="notes-list"></div>
      </aside>
      <section class="notebook-workspace" aria-label="Note editor">
        <div class="empty-notebook" id="empty-notebook">
          <svg aria-hidden="true" width="64" height="64" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 3h22v26H5V3ZM9 3v26M13 10h10M13 15h10M13 20h7"/></svg>
          <h2>A little space for your thoughts.</h2>
          <p>Use New note to start writing.</p>
          <p class="save-explainer">Your notes save as you write.</p>
        </div>
        <div class="notebook-editor" id="editor" tabindex="-1" aria-label="Writing area" style="display:none">
          <div class="editor-content">
            <div class="editor-heading">
              <div class="note-name">
                <label class="sr-only" for="editor-title">Title</label>
                <input id="editor-title" class="editor-title" type="text" maxlength="120" placeholder="Untitled" autocomplete="off">
              </div>
              <div class="editor-meta">
                <label class="sr-only" for="note-section">Section</label>
                <select id="note-section" aria-label="Section" data-quiet-select></select>
              </div>
              <time id="note-timestamp"></time>
            </div>
            <div class="editor-paper">
              <div class="writing-mode" id="writing-mode">
                <label class="sr-only" for="editor-body">Note</label>
                <textarea id="editor-body" class="editor-body" maxlength="20000" placeholder="Start writing…"></textarea>
              </div>
              <div class="drawing-mode" id="drawing-mode" style="display:none">
                <div class="note-drawing-paper" id="drawing-paper"><canvas id="note-drawing" width="600" height="600" aria-label="Note drawing area">This browser does not support drawing.</canvas></div>
              </div>
              <p class="note-tool-status" id="tool-status" role="status" aria-live="polite" style="display:none"></p>
            </div>
          </div>
          <aside class="note-tools drawing-toolbar" id="note-tools" role="toolbar" aria-label="Note tools" aria-orientation="vertical" data-layout="vertical" data-dock="right">
            <button class="tool-button note-tool" id="write-tool" type="button" aria-label="Write" title="Write" aria-pressed="true"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M12 5v15M8 20h8"/></svg></button>
            <button class="tool-button note-tool" id="pen" type="button" aria-label="Pen" aria-pressed="false" aria-expanded="false" aria-controls="pen-options" data-style="sharp" title="Pen"><svg class="button-icon pen-style-icon pencil-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.8L16 4.5a2.1 2.1 0 0 1 3 3L8.3 18.2 4 20zm9.8-13.3 3.5 3.5"/></svg><svg class="button-icon pen-style-icon sharp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 7 12l9-9 5 5-9 9-8 3ZM7 12l5 5M4 20l5.5-5.5"/></svg><svg class="button-icon pen-style-icon brush-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 17.5 4a2 2 0 0 1 2.8 2.8L13 16M10 14c-3 0-3 2-3 3.5S6 20 4 20c4 2 9 0 9-4l-3-2z"/></svg></button>
            <button class="tool-button note-tool" id="width" type="button" aria-label="Pen width" aria-expanded="false" aria-controls="width-options" title="Pen width"><svg class="button-icon size-icon ink-size-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/></svg><svg class="button-icon size-icon eraser-size-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3" transform="rotate(45 12 12)"/></svg></button>
            <button class="tool-button note-tool" id="eraser" type="button" aria-label="Eraser" aria-pressed="false" title="Eraser"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14 13 5a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L10 20H7zM9 9l6 6M10 20h10"/></svg></button>
            <span class="drawing-tool-divider drawing-actions-start" aria-hidden="true"></span>
            <button class="tool-button note-tool" id="undo-tool" type="button" aria-label="Undo" data-lang-label="undo" title="Undo" data-lang-title="undo" disabled><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6 4 11l5 5M4 11h9a6 6 0 0 1 6 6"/></svg></button>
          </aside>
        </div>
      </section>
      <div class="draw-subtools notebook-popover" id="index-menu" hidden></div>
      <div class="draw-subtools notebook-popover pen-subtools" id="pen-options" role="group" aria-label="Pen type" hidden>
        <button type="button" id="pen-pencil" aria-pressed="false"><svg class="pen-option-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4.8L16 4.5a2.1 2.1 0 0 1 3 3L8.3 18.2 4 20zm9.8-13.3 3.5 3.5"/></svg>Pencil</button>
        <button type="button" id="pen-sharp" aria-pressed="true"><svg class="pen-option-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 7 12l9-9 5 5-9 9-8 3ZM7 12l5 5M4 20l5.5-5.5"/></svg>Sharp pen</button>
        <button type="button" id="pen-brush" aria-pressed="false"><svg class="pen-option-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14 17.5 4a2 2 0 0 1 2.8 2.8L13 16M10 14c-3 0-3 2-3 3.5S6 20 4 20c4 2 9 0 9-4l-3-2z"/></svg>Brush</button>
      </div>
      <div class="draw-subtools notebook-popover width-subtools" id="width-options" role="group" aria-label="Tool size" hidden>
        <button type="button" id="width-fine" aria-pressed="false">Fine</button>
        <button type="button" id="width-medium" aria-pressed="true">Medium</button>
        <button type="button" id="width-thick" aria-pressed="false">Thick</button>
      </div>
    </main>
    <noscript><p>Enable JavaScript in your browser to write notes.</p></noscript>
  </div>
  <script src="../fullscreen.js?v=1"></script>
  <script src="../language.js?v=1"></script>
  <script src="../orientation.js?v=viewport-fit-3"></script>
  <script src="../pen-tools.js?v=1"></script>
  <script src="state.js?v=notebook-tools-1"></script>
  <script src="ink.js?v=notebook-tools-1"></script>
  <script src="../menu-dismiss.js?v=1"></script>
  <script src="app.js?v=notebook-tools-1"></script>
  <script src="../dropdowns.js?v=outside-press"></script>
</body>
</html>
