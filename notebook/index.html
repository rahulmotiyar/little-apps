<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Notebook</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../productivity.css">
  <link rel="stylesheet" href="styles.css?v=20261121-manual-rotation-v2">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../still-apps.css?v=20261121-manual-rotation-v2">
  <link rel="stylesheet" href="../drawing/toolbar.css?v=20261121-notebook-rail">
  <link rel="stylesheet" href="workspace.css?v=20261121-notebook-workspace">
  <link rel="stylesheet" href="../fullscreen.css?v=1">
</head>
<body>
  <div class="tool-page notebook-page is-empty" id="notebook-page">
    <header class="tool-header notebook-header">
      <div class="notebook-heading">
        <button class="tool-button" id="show-notes" type="button" aria-label="Back to notes" title="Back to notes"><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 5-7 7 7 7M7 12h14"/></svg>Notes</button>
        <h1 class="tool-title">Notebook</h1>
      </div>
      <div class="tool-controls">
        <div class="tool-actions">
          <button class="tool-button icon-undo" id="undo-remove" type="button" aria-label="Undo remove" title="Undo remove" style="display:none">Undo remove</button>
        </div>
        <span class="notebook-exit app-exit-group"><a class="close-app app-close" id="exit" href="../" aria-label="Exit Notebook"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a></span>
      </div>
<button type="button" id="web-fullscreen" class="web-fullscreen-button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
  <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
  <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
</button>
<div id="web-fullscreen-message" class="web-fullscreen-message" role="status"></div>
    </header>
    <p class="tool-status storage-status" id="storage-status" role="status" aria-live="polite" style="display:none"></p>
    <main class="notebook-layout">
      <aside class="notes-list-panel" aria-label="Notebook index">
        <div class="index-heading">
          <h2>Index</h2>
          <div class="index-actions"><button class="index-action" id="new-note" type="button" aria-label="New note">New</button><button class="index-action" id="new-section" type="button" aria-label="New section">+ Section</button></div>
        </div>
        <form class="section-form" id="section-form" hidden>
          <label for="section-name">Section name</label>
          <input id="section-name" type="text" maxlength="60" autocomplete="off" required>
          <div class="section-form-actions">
            <button class="tool-button" id="add-section" type="submit">Add</button>
            <button class="tool-button" id="cancel-section" type="button">Cancel</button>
          </div>
          <p id="section-error" role="status" aria-live="polite"></p>
        </form>
        <div id="notes-list"></div>
      </aside>
      <section class="notebook-workspace" aria-label="Note editor">
        <div class="empty-notebook" id="empty-notebook">
          <svg aria-hidden="true" width="64" height="64" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 3h22v26H5V3ZM9 3v26M13 10h10M13 15h10M13 20h7"/></svg>
          <h2>A little space for your thoughts.</h2>
          <p>Tap New in the index to start writing.</p>
          <p class="save-explainer">Your notes save as you write.</p>
        </div>
        <div class="notebook-editor" id="editor" tabindex="-1" aria-label="Writing area" style="display:none">
          <div class="editor-heading">
            <label class="sr-only" for="editor-title">Title</label>
            <input id="editor-title" class="editor-title" type="text" maxlength="120" placeholder="Untitled note" autocomplete="off">
          <div class="editor-meta">
            <label for="note-section">Section</label>
            <select id="note-section" aria-label="Section" data-quiet-select></select>
            <time id="note-timestamp"></time>
          </div>
          </div>
          <div class="editor-content">
            <div class="editor-paper">
              <div class="writing-mode" id="writing-mode">
                <label class="sr-only" for="editor-body">Note</label>
                <textarea id="editor-body" class="editor-body" maxlength="20000" placeholder="Start writing…"></textarea>
              </div>
              <div class="drawing-mode" id="drawing-mode" style="display:none">
                <div class="note-drawing-paper" id="drawing-paper"><canvas id="note-drawing" width="600" height="600" aria-label="Note drawing area">This browser does not support drawing.</canvas></div>
              </div>
              <p class="note-tool-status" id="tool-status" role="status" aria-live="polite" style="display:none"></p>
            </div>
            <aside class="note-tools drawing-toolbar" role="toolbar" aria-label="Note tools" aria-orientation="vertical" data-layout="vertical" data-dock="right">
              <button class="tool-button note-tool" id="write-tool" type="button" aria-label="Write" title="Write" aria-pressed="true"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M12 5v15M8 20h8"/></svg><span>Write</span></button>
              <button class="tool-button note-tool" id="draw-tool" type="button" aria-label="Draw" title="Draw" aria-pressed="false"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 15 16 3l5 5L9 20l-6 1 1-6ZM13 6l5 5"/></svg><span>Draw</span></button>
              <button class="tool-button note-tool" id="erase-tool" type="button" aria-label="Erase" title="Erase" aria-pressed="false"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 13 9-10 9 8-9 10H9l-5-4v-4ZM8 9l9 8M13 21h9"/></svg><span>Erase</span></button>
              <span class="drawing-tool-divider drawing-actions-start" aria-hidden="true"></span>
              <button class="tool-button note-tool" id="undo-tool" type="button" aria-label="Undo" title="Undo" disabled><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6 4 11l5 5M4 11h9a6 6 0 0 1 6 6"/></svg><span>Undo</span></button>
              <button class="tool-button note-tool" id="remove-note" type="button" aria-label="Delete note" title="Delete note"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg><span>Delete</span></button>
            </aside>
          </div>
          <p class="editor-status" id="editor-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <noscript><p>Enable JavaScript in your browser to write notes.</p></noscript>
  </div>
  <script src="../fullscreen.js?v=1"></script>
  <script src="../orientation.js?v=20261121-display-preferences"></script>
  <script src="state.js"></script>
  <script src="ink.js?v=20261121-manual-rotation-v2"></script>
  <script src="app.js"></script>
  <script src="../dropdowns.js?v=20261121-manual-rotation-v2"></script>
</body>
</html>
