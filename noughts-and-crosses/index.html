<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TicTacToe</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../productivity.css">
  <link rel="stylesheet" href="game.css?v=game-exit-1">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../still-apps.css?v=game-exit-1">
  <link rel="stylesheet" href="../fullscreen.css?v=viewport-fit-3">
</head>
<body>
  <div class="page game-page" id="game-page">
    <header class="game-header">
      <div class="game-heading">
        <h1>TicTacToe</h1>
        <div class="sr-only" role="status" aria-live="polite" aria-atomic="true">
          <p class="turn-status" id="turn-status">X goes first</p>
          <p class="sr-only" id="turn-hint">Tap any empty square.</p>
        </div>
      </div>
      <div class="game-tools">
        <div class="game-actions">
          <button class="tool-button" id="undo" type="button" aria-label="Undo" data-lang-label="undo" title="Undo" data-lang-title="undo" disabled><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6 4 11l5 5M4 11h9a6 6 0 0 1 6 6"/></svg><span class="button-label">Undo</span></button>
          <button class="tool-button" id="new-round" type="button" aria-label="Reset TicTacToe" data-lang-label="reset" title="Reset" data-lang-title="reset"><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg></button>
          <span class="exit-separator app-exit-group"><a class="close-app app-close" id="game-exit" href="../" aria-label="Exit TicTacToe" data-lang-label="exit"><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a></span>
        </div>
      </div>
<button type="button" id="web-fullscreen" class="web-fullscreen-button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
  <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
  <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
</button>
<div id="web-fullscreen-message" class="web-fullscreen-message" role="status"></div>
    </header>
    <main>
      <noscript><p>This game needs JavaScript. Enable it in your browser settings, then reload this page.</p></noscript>
      <div class="game-layout" id="game" style="display:none">
        <div class="board-column">
          <div class="board-shell" id="board-shell">
            <table class="board" aria-label="TicTacToe board">
              <tbody>
                <tr><td><button class="cell" data-cell="0" aria-label="Top left, empty" type="button"></button></td><td><button class="cell" data-cell="1" aria-label="Top middle, empty" type="button"></button></td><td><button class="cell" data-cell="2" aria-label="Top right, empty" type="button"></button></td></tr>
                <tr><td><button class="cell" data-cell="3" aria-label="Middle left, empty" type="button"></button></td><td><button class="cell" data-cell="4" aria-label="Centre, empty" type="button"></button></td><td><button class="cell" data-cell="5" aria-label="Middle right, empty" type="button"></button></td></tr>
                <tr><td><button class="cell" data-cell="6" aria-label="Bottom left, empty" type="button"></button></td><td><button class="cell" data-cell="7" aria-label="Bottom middle, empty" type="button"></button></td><td><button class="cell" data-cell="8" aria-label="Bottom right, empty" type="button"></button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <p id="storage-note" style="display:none">Your browser cannot save this game. Keep this page open to continue playing.</p>
    </main>
  </div>
  <div class="result-overlay" id="result-overlay" style="display:none" aria-hidden="true">
    <div class="result-center">
      <section class="result-dialog" role="dialog" aria-labelledby="result-title" aria-describedby="result-copy">
        <div class="result-stars" aria-hidden="true">
          <svg class="result-star" width="26" height="26" viewBox="0 0 24 24" focusable="false"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="result-star result-star-big" width="38" height="38" viewBox="0 0 24 24" focusable="false"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="result-star" width="26" height="26" viewBox="0 0 24 24" focusable="false"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
        </div>
        <svg class="result-handshake" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m11 17 2 2a2 2 0 0 0 3-3m-2-2 2.6 2.6a2 2 0 0 0 2.8-2.8L15 9.4l-2 2a2 2 0 0 1-2.8-2.8L13 5.9a4 4 0 0 1 4.8-.7L20 6.5M4 7l2.5-1.5a4 4 0 0 1 4 .6M4.2 14.1l5 5a2 2 0 0 0 2.8 0l.5-.6M3.5 6l3.2 1.4-2 7L1.5 13Zm17 0-3.2 1.4 2 7 3.2-1.4Z"/></svg>
        <h2 class="result-title" id="result-title"></h2>
        <p class="result-copy" id="result-copy"></p>
        <div class="result-actions">
          <button class="result-action result-primary" id="result-new-round" type="button"><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg><span class="button-label">Reset</span></button>
        </div>
      </section>
    </div>
  </div>
  <script src="../fullscreen.js?v=1"></script>
  <script src="../language.js?v=1"></script>
  <script src="../orientation.js?v=viewport-fit-3"></script>
  <script src="game.js"></script>
  <script src="../game-flow.js?v=game-exit-1"></script>
  <script src="app.js?v=game-exit-1"></script>
  <script src="../dropdowns.js?v=viewport-fit-3"></script>
</body>
</html>
