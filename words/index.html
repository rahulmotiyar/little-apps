<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-lang-text="words">Words</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../productivity.css">
  <link rel="stylesheet" href="styles.css?v=viewport-fit-3">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../still-apps.css?v=game-exit-1">
  <link rel="stylesheet" href="../fullscreen.css?v=viewport-fit-3">
</head>
<body>
  <div class="tool-page words-page" id="words-page">
    <header class="tool-header words-header">
      <h1 class="tool-title" data-lang-text="words">Words</h1>
      <div class="tool-controls">
        <div class="tool-actions words-actions">
          <label class="sr-only" for="group" data-lang-text="group">School group</label>
          <select id="group" aria-label="School group" data-lang-label="group">
            <option value="3">Groep 3</option><option value="4">Groep 4</option><option value="5">Groep 5</option>
          </select>
          <label class="sr-only" for="activity" data-lang-text="activity">Activity</label>
          <select id="activity" aria-label="Activity" data-lang-label="activity"><option value="read" data-lang-text="reading">Reading</option><option value="spell" data-lang-text="spelling">Spelling</option></select>
          <button class="tool-button" id="new-round" type="button" aria-label="Reset Words" data-lang-label="reset" title="Reset" data-lang-title="reset"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg></button>
        </div>
        <span class="words-exit app-exit-group"><a class="close-app app-close" id="exit" href="../" aria-label="Exit Words" data-lang-label="exit"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a></span>
      </div>
<button type="button" id="web-fullscreen" class="web-fullscreen-button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
  <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
  <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
</button>
<div id="web-fullscreen-message" class="web-fullscreen-message" role="status"></div>
    </header>
    <main class="words-main" lang="nl">
      <noscript><p>Zet JavaScript aan om te spelen.</p></noscript>
      <div class="round-progress">
        <div class="stars" id="stars" aria-label="0 van 5 sterren">
          <svg class="progress-star" id="star-0" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-1" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-2" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-3" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-4" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
        </div>
        <p class="progress-copy" id="progress-copy">1 van 5</p>
      </div>
      <section class="read-panel learning-panel" id="read-panel" aria-label="Lezen">
        <div class="reading-text">
        <h2 class="story-title" id="story-title"></h2>
        <p class="story" id="story"></p>
        </div>
        <div class="reading-task">
        <h3 class="read-question" id="read-question"></h3>
        <div class="read-choices" id="read-choices" role="group" aria-labelledby="read-question"></div>
        </div>
      </section>
      <section class="spell-panel learning-panel" id="spell-panel" style="display:none" aria-label="Spellen">
        <div class="spell-riddle">
        <p class="spell-prompt">Welk woord zoeken we?</p>
        <img class="spell-picture" id="spell-picture" width="120" height="90" alt="" aria-hidden="true" style="display:none">
        <h2 class="spell-clue" id="spell-clue"></h2>
        </div>
        <div class="spell-build">
        <div class="word-slots" id="word-slots" role="group" aria-label="Jouw woord"></div>
        <p class="bank-instruction">Tik de letters in de goede volgorde.</p>
        <div class="letter-bank" id="letter-bank" role="group" aria-label="Letters"></div>
        <div class="spell-tools">
          <button class="tool-button" id="undo-letter" type="button"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-5 5 5 5M4 9h9a7 7 0 1 1-5 12"/></svg><span>Terug</span></button>
          <button class="tool-button check-word" id="check-word" type="button"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>Controleer</span></button>
        </div>
        </div>
      </section>
      <div class="answer-feedback">
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </div>
    </main>
  </div>
  <div class="words-result" id="result-overlay" style="display:none" aria-hidden="true">
    <div class="result-center">
      <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-copy">
        <div class="result-stars" aria-hidden="true">★ ★ ★ ★ ★</div>
        <h2 class="result-title" id="result-title" lang="nl">Hoera!</h2>
        <p class="result-copy" id="result-copy" lang="nl">Vijf sterren. Goed gedaan!</p>
        <button class="result-action result-primary" id="result-new-round" type="button"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg><span>Reset</span></button>
        <a class="result-action app-close" id="result-exit" href="../" aria-label="Exit Words" data-lang-label="exit"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a>
      </section>
    </div>
  </div>
  <script src="../fullscreen.js?v=1"></script>
  <script src="../language.js?v=1"></script>
  <script src="../orientation.js?v=viewport-fit-3"></script>
  <script src="engine.js"></script><script src="../game-flow.js?v=game-exit-1"></script>
  <script src="app.js?v=game-exit-1"></script>
  <script src="../menu-dismiss.js?v=1"></script>
  <script src="../dropdowns.js?v=language-1"></script>
</body>
</html>
