<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Maths</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../productivity.css">
  <link rel="stylesheet" href="styles.css?v=viewport-fit-3">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../still-apps.css?v=game-exit-1">
  <link rel="stylesheet" href="../fullscreen.css?v=viewport-fit-3">
</head>
<body>
  <div class="tool-page sums-page" id="sums-page">
    <header class="tool-header sums-header">
      <h1 class="tool-title">Maths</h1>
      <div class="tool-controls">
        <div class="tool-actions sums-actions">
          <label class="sr-only" for="mode">Sums</label>
          <select id="mode" aria-label="Sums">
            <option value="add" data-short="+">+ Addition</option>
            <option value="subtract" data-short="−">− Subtraction</option>
            <option value="mixed" data-short="±">± Mixed</option>
          </select>
          <label class="sr-only" for="level">School group</label>
          <select id="level" aria-label="School group">
            <option value="3">Groep 3</option>
            <option value="4">Groep 4</option>
            <option value="5">Groep 5</option>
          </select>
          <button class="tool-button" id="new-round" type="button" aria-label="Reset Maths" title="Reset"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg><span>Reset</span></button>
        </div>
        <span class="sums-exit app-exit-group"><a class="close-app app-close" id="exit" href="../" aria-label="Exit Maths"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a></span>
      </div>
<button type="button" id="web-fullscreen" class="web-fullscreen-button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
  <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
  <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></svg>
</button>
<div id="web-fullscreen-message" class="web-fullscreen-message" role="status"></div>
    </header>
    <main class="sums-main">
      <noscript><p>Turn on JavaScript to play Maths.</p></noscript>
      <div class="round-progress">
        <div class="stars" id="stars" aria-label="Stars collected">
          <svg class="progress-star" id="star-0" data-star="0" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-1" data-star="1" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-2" data-star="2" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-3" data-star="3" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
          <svg class="progress-star" id="star-4" data-star="4" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.9 1.4 7L12 17.7l-6.2 3.5 1.4-7L2 9.3l7-.8Z"/></svg>
        </div>
        <p id="progress-copy" class="progress-copy">Sum 1 of 5</p>
      </div>
      <div class="math-layout">
        <section class="question-area" aria-label="The sum">
          <div class="question-anchor"><p class="sr-only" id="question-prompt">How many altogether?</p>
          <div class="equation" role="math" id="equation"><span id="left-number">?</span> <span class="operator" id="operator">+</span> <span id="right-number">?</span> <span class="equals">=</span> <span class="answer-slot" id="answer-slot">?</span></div>
          <button class="tool-button hint-button" id="hint" type="button" aria-expanded="false" aria-controls="counting-help"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg><span id="hint-label">Count with dots</span></button>
          <div class="counting-help" id="counting-help" style="display:none">
            <p id="counting-copy"></p>
            <div class="counting-model" id="counting-model"></div>
          </div>
          </div>
        </section>
        <section class="answers-area" aria-label="Choose an answer">
          <div class="choices" id="choices">
            <div class="choice-row">
              <div class="choice-slot"><button class="answer-choice" id="choice-0" type="button"><span id="choice-number-0">?</span></button></div>
              <div class="choice-slot"><button class="answer-choice" id="choice-1" type="button"><span id="choice-number-1">?</span></button></div>
            </div>
            <div class="choice-row">
              <div class="choice-slot"><button class="answer-choice" id="choice-2" type="button"><span id="choice-number-2">?</span></button></div>
              <div class="choice-slot"><button class="answer-choice" id="choice-3" type="button"><span id="choice-number-3">?</span></button></div>
            </div>
          </div>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
  </div>
  <div class="sums-result" id="result-overlay" style="display:none" aria-hidden="true">
    <div class="result-center">
      <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-copy">
        <div class="result-stars" aria-hidden="true">★ ★ ★ ★ ★</div>
        <h2 class="result-title" id="result-title">Five stars!</h2>
        <p class="result-copy" id="result-copy">Five little sums. A big hooray!</p>
        <button class="result-action result-primary" id="result-new-round" type="button"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 1 4M19 4v4h-4"/></svg><span>Reset</span></button>
        <a class="result-action app-close" id="result-exit" href="../" aria-label="Exit Maths"><svg class="button-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></a>
      </section>
    </div>
  </div>
  <script src="../fullscreen.js?v=1"></script>
  <script src="../orientation.js?v=viewport-fit-3"></script>
  <script src="engine.js"></script>
  <script src="../game-flow.js?v=game-exit-1"></script>
  <script src="app.js?v=game-exit-1"></script>
  <script src="../menu-dismiss.js?v=1"></script>
  <script src="../dropdowns.js?v=outside-press"></script>
</body>
</html>
